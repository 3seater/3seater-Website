<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3seater — Twenty new directions</title><meta name="description" content="Twenty independent portfolio directions for 3seater."><style>
@font-face{font-family:Hub;src:url('fonts/manrope/font.ttf');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#eeeDE9;color:#222;font:14px/1.5 Hub,sans-serif}::selection{background:#222;color:#fff}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid #222;outline-offset:5px}header{padding:50px 4vw 40px;border-bottom:1px solid #aaa;display:flex;justify-content:space-between;gap:40px;align-items:end}h1{font-size:clamp(32px,4vw,58px);font-weight:500;line-height:1.05;letter-spacing:-.035em;margin:0}header p{max-width:470px;margin:0;font-size:14px}main{padding:35px 4vw 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 24px}.direction{display:block}.capture{aspect-ratio:1.55;overflow:hidden;background:#deddd7;position:relative}.capture img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s}.direction:hover .capture img{transform:scale(1.03)}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}.capture img{position:relative}.name{display:flex;justify-content:space-between;margin:15px 0 7px;gap:20px}h2{font-size:19px;font-weight:550;letter-spacing:-.02em;margin:0}.number{font-size:12px;font-variant-numeric:tabular-nums}article p{font-size:12px;max-width:46ch;margin:0;color:#555}footer{padding:30px 4vw;border-top:1px solid #aaa;font-size:12px}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}header p{margin-top:25px}}@media(max-width:550px){header{padding:30px 22px}main{padding:30px 22px;grid-template-columns:1fr;gap:35px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><h1>3seater.<br>Twenty new directions.</h1><p>One archive. Twenty different ways to explore it.<br>Open any direction to browse the full projects and media.</p></header><main id="directions"></main><footer>Batch three · Graphic design / Motion design / 3D</footer><script>
fetch('directions.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(ds=>{document.querySelector('main').innerHTML=ds.map(d=>`<article><a class="direction" href="${String(d.id).padStart(2,'0')}/"><div class="capture" style="background:${d.bg};color:${d.fg}"><span class="fallback">${d.name}</span><img src="captures/${String(d.id).padStart(2,'0')}.png" alt="${d.name} homepage preview" loading="lazy" onerror="this.remove()"></div><div class="name"><h2>${d.name}</h2><span class="number">${String(d.id).padStart(2,'0')} / 20</span></div><p>${d.idea}</p></a></article>`).join('')}).catch(()=>document.querySelector('main').innerHTML='<p>Could not load the directions. Please reload.</p>');
</script></body></html>
